[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-conformance-lab"
version = "0.1.0"
description = "Offline Open Intelligence manifest and fixture conformance runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-conformance = "oif_conformance.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
